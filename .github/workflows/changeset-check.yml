name: Changeset Check

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, labeled, unlabeled]

jobs:
  check-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Skip check if PR has 'skip-changeset' label
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('skip-changeset')) {
              console.log('Skipping changeset check due to skip-changeset label');
              return;
            }

            // Get list of files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            // Check if any changeset files were added
            const changesetFiles = files.filter(f =>
              f.filename.startsWith('.changeset/') &&
              f.filename.endsWith('.md') &&
              f.status === 'added'
            );

            if (changesetFiles.length === 0) {
              core.setFailed(`This PR is missing a changeset file.

Please create a changeset file in .changeset/ directory.

Example .changeset/my-change.md:
\`\`\`
---
myapp-core: minor
---

Description of the change.
\`\`\`

If this change doesn't need a changeset (e.g., docs only), add the 'skip-changeset' label.`);
            } else {
              console.log(`Found ${changesetFiles.length} changeset file(s): ${changesetFiles.map(f => f.filename).join(', ')}`);
            }
