name: Label Hotfix PRs

on:
  pull_request:
    types: [opened]
    branches:
      - 'rc'

jobs:
  label-hotfix:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add hotfix label
        uses: actions/github-script@v7
        with:
          script: |
            // Ensure hotfix label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'hotfix',
                color: 'd93f0b',
                description: 'Hotfix PR targeting RC branch'
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = already exists
            }

            // Add label to PR
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['hotfix']
            });

            console.log(`Labeled PR #${context.payload.pull_request.number} as hotfix`);
