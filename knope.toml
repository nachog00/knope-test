[packages.myapp-core]
versioned_files = ["crates/core/Cargo.toml"]
changelog = "crates/core/CHANGELOG.md"
scopes = ["core", "myapp-core"]

[packages.myapp-utils]
versioned_files = ["crates/utils/Cargo.toml"]
changelog = "crates/utils/CHANGELOG.md"
scopes = ["utils", "myapp-utils"]

[packages.myapp-api]
versioned_files = ["crates/api/Cargo.toml"]
changelog = "crates/api/CHANGELOG.md"
scopes = ["api", "myapp-api"]

[packages.myapp-client]
versioned_files = ["crates/client/Cargo.toml"]
changelog = "crates/client/CHANGELOG.md"
scopes = ["client", "myapp-client"]

[packages.myapp-cli]
versioned_files = ["crates/cli/Cargo.toml"]
changelog = "crates/cli/CHANGELOG.md"
scopes = ["cli", "myapp-cli"]

# Cargo.lock is updated automatically by cargo when versions change

# Workflow for creating RC prereleases
[[workflows]]
name = "prepare-rc"
help_text = "Prepare a release candidate (bump versions with -rc.N suffix, update changelogs)"

[[workflows.steps]]
type = "PrepareRelease"
prerelease_label = "rc"

[[workflows.steps]]
type = "Command"
command = "git add -A && git commit -m 'chore: prepare release candidate'"

# Workflow for final release (removes prerelease suffix)
[[workflows]]
name = "release"
help_text = "Create final release (finalize versions, update changelogs, tag, push)"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git add -A && git commit -m 'chore: prepare release'"

[[workflows.steps]]
type = "Release"

# Workflow for documenting changes
[[workflows]]
name = "document-change"
help_text = "Create a new changeset file to be included in the next release"

[[workflows.steps]]
type = "CreateChangeFile"
